  <!-- Solid Canvas Background -->
  <rect width="100%" height="100%" fill="url(#canvasBg)" rx="14" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Decorative Header Bar -->
  <g transform="translate(35, 30)">
