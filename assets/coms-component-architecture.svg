    <rect x="0" y="0" width="390" height="5" rx="2.5" fill="url(#purpleAccent)"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="135" height="20" rx="4" fill="#4C1D95" fill-opacity="0.6"/>
    <text x="24" y="30" fill="#C4B5FD" font-size="10" font-weight="700" letter-spacing="0.6px">BOUNDED CONTEXT 03</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Capacity &amp; Logistics</text>
    <text x="16" y="76" fill="#94A3B8" font-size="11.5">Synthesizer batch slots &amp; 3-lane transit priority</text>
    
    <!-- Entities Box -->
    <rect x="16" y="92" width="358" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="114" fill="#A78BFA" font-size="11" font-weight="700">CORE DOMAIN ENTITIES &amp; SERVICES:</text>
    
    <circle cx="32" cy="132" r="3" fill="#8B5CF6"/>
    <text x="42" y="136" fill="#E2E8F0" font-size="12" font-weight="500">Cyclotron Synthesizer Capacity Slots</text>
    
    <circle cx="32" cy="154" r="3" fill="#8B5CF6"/>
    <text x="42" y="158" fill="#E2E8F0" font-size="12" font-weight="500">End-of-Synthesis (EOS) Batch Allocation</text>
    
    <circle cx="32" cy="176" r="3" fill="#8B5CF6"/>
    <text x="42" y="180" fill="#E2E8F0" font-size="12" font-weight="500">3-Lane Highway Transit Prioritization Model</text>
    
    <circle cx="32" cy="198" r="3" fill="#8B5CF6"/>
    <text x="42" y="202" fill="#E2E8F0" font-size="12" font-weight="500">Working Calendar &amp; Regional Exception Engine</text>

    <!-- Footer Tag -->
    <rect x="16" y="230" width="358" height="52" rx="6" fill="#1E293B" stroke="#4C1D95" stroke-width="1"/>
    <text x="26" y="250" fill="#C4B5FD" font-size="11" font-weight="600">Domain Responsibility:</text>
    <text x="26" y="268" fill="#CBD5E1" font-size="11">Prevents over-subscription and validates courier transit limits.</text>
  </g>

  <!-- Flow Arrows Between Top Row & Bottom Row -->
  <!-- Context 1 -> Context 4 -->
  <path d="M 180 405 L 180 435" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <rect x="110" y="412" width="140" height="18" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="0.8"/>
  <text x="180" y="424" fill="#93C5FD" font-size="9.5" font-weight="600" text-anchor="middle">Verified Session (RBAC)</text>

  <!-- Context 2 -> Context 4 -->
  <path d="M 550 405 L 550 435 L 340 435 L 340 445" stroke="#10B981" stroke-width="2" stroke-dasharray="4,3" fill="none"/>

  <!-- Context 3 <-> Context 4 -->
  <path d="M 890 450 L 435 450" stroke="#A78BFA" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-amber)"/>
  <rect x="570" y="440" width="170" height="20" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-width="0.8"/>
  <text x="655" y="454" fill="#C4B5FD" font-size="9.5" font-weight="600" text-anchor="middle">Slot Reservation &amp; Batch Sync</text>

  <!-- Grid Row 2: Contexts 4, 5, 6 (y=455) -->

  <!-- CONTEXT 4: Dose Order Aggregate (CORE SUBDOMAIN) (x=35, y=455, w=390, h=300) -->
  <g transform="translate(35, 455)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="390" height="300" rx="10" fill="url(#cardDark)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.9"/>
    <rect x="0" y="0" width="390" height="5" rx="2.5" fill="url(#amberAccent)"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="155" height="20" rx="4" fill="#78350F" fill-opacity="0.7"/>
    <text x="24" y="30" fill="#FDE68A" font-size="10" font-weight="700" letter-spacing="0.6px">CORE DOMAIN AGGREGATE</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Dose Order Aggregate</text>
    <text x="16" y="76" fill="#FCD34D" font-size="11.5" font-weight="500">Multi-step approvals &amp; Cancel-and-Recreate</text>
    
    <!-- Entities Box -->
    <rect x="16" y="92" width="358" height="125" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
    <text x="28" y="114" fill="#FBBF24" font-size="11" font-weight="700">CORE AGGREGATE ROOT &amp; SERVICES:</text>
    
    <circle cx="32" cy="132" r="3" fill="#F59E0B"/>
    <text x="42" y="136" fill="#E2E8F0" font-size="12" font-weight="500">DoseOrder Entity (Aggregate Root Lifecycle)</text>
    
    <circle cx="32" cy="154" r="3" fill="#F59E0B"/>
    <text x="42" y="158" fill="#E2E8F0" font-size="12" font-weight="500">3-Step Clinical Sign-off (Coordinator &#8594; Lead &#8594; QA)</text>
    
    <circle cx="32" cy="176" r="3" fill="#F59E0B"/>
    <text x="42" y="180" fill="#E2E8F0" font-size="12" font-weight="500">Operational Badges: [B] [U] [U5+] [M] [T] [V] [N]</text>
    
    <circle cx="32" cy="198" r="3" fill="#F59E0B"/>
    <text x="42" y="202" fill="#E2E8F0" font-size="12" font-weight="500">GxP Cancel-and-Recreate Immutable Lineage</text>

    <!-- Footer Tag -->
    <rect x="16" y="230" width="358" height="52" rx="6" fill="#1E293B" stroke="#78350F" stroke-width="1"/>
    <text x="26" y="250" fill="#FDE68A" font-size="11" font-weight="600">Domain Responsibility:</text>
    <text x="26" y="268" fill="#CBD5E1" font-size="11">Orchestrates state transitions and enforces calibration bounds.</text>
  </g>

  <!-- Flow Context 4 -> Context 5 -->
  <path d="M 428 600 L 460 600" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <!-- CONTEXT 5: Injection Status & Decay Assay (x=465, y=455, w=390, h=300) -->
  <g transform="translate(465, 455)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="390" height="300" rx="10" fill="url(#cardDark)" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="390" height="5" rx="2.5" fill="url(#roseAccent)"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="135" height="20" rx="4" fill="#881337" fill-opacity="0.6"/>
    <text x="24" y="30" fill="#FDA4AF" font-size="10" font-weight="700" letter-spacing="0.6px">BOUNDED CONTEXT 05</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Injection Status &amp; Assay</text>
    <text x="16" y="76" fill="#94A3B8" font-size="11.5">Radioactive decay correction &amp; clinical loop</text>
    
    <!-- Entities Box -->
    <rect x="16" y="92" width="358" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="114" fill="#FB7185" font-size="11" font-weight="700">CORE DOMAIN ENTITIES &amp; SERVICES:</text>
    
    <circle cx="32" cy="132" r="3" fill="#F43F5E"/>
    <text x="42" y="136" fill="#E2E8F0" font-size="12" font-weight="500">Nuclear Decay Math Engine (A = A₀ · e^(-λt))</text>
    
    <circle cx="32" cy="154" r="3" fill="#F43F5E"/>
    <text x="42" y="158" fill="#E2E8F0" font-size="12" font-weight="500">Pre-Injection Radioactivity Assay Verification</text>
    
    <circle cx="32" cy="176" r="3" fill="#F43F5E"/>
    <text x="42" y="180" fill="#E2E8F0" font-size="12" font-weight="500">Syringe Residual Waste Assay &amp; Net Administered</text>
    
    <circle cx="32" cy="198" r="3" fill="#F43F5E"/>
    <text x="42" y="202" fill="#E2E8F0" font-size="12" font-weight="500">AdministrationAssay Protocol Adherence Report</text>

    <!-- Footer Tag -->
    <rect x="16" y="230" width="358" height="52" rx="6" fill="#1E293B" stroke="#881337" stroke-width="1"/>
    <text x="26" y="250" fill="#FDA4AF" font-size="11" font-weight="600">Domain Responsibility:</text>
    <text x="26" y="268" fill="#CBD5E1" font-size="11">Closes post-delivery loop to verify exact dosage administered.</text>
  </g>

  <!-- Flow Context 5 -> Context 6 -->
  <path d="M 858 600 L 890 600" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- CONTEXT 6: 21 CFR Part 11 Audit & Telemetry (x=895, y=455, w=390, h=300) -->
  <g transform="translate(895, 455)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="390" height="300" rx="10" fill="url(#cardDark)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="390" height="5" rx="2.5" fill="url(#cyanAccent)"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="135" height="20" rx="4" fill="#164E63" fill-opacity="0.6"/>
    <text x="24" y="30" fill="#67E8F9" font-size="10" font-weight="700" letter-spacing="0.6px">BOUNDED CONTEXT 06</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">21 CFR Part 11 Audit</text>
    <text x="16" y="76" fill="#94A3B8" font-size="11.5">Dual-layer immutable triggers &amp; WORM log</text>
    
    <!-- Entities Box -->
    <rect x="16" y="92" width="358" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="114" fill="#22D3EE" font-size="11" font-weight="700">CORE DOMAIN ENTITIES &amp; SERVICES:</text>
    
    <circle cx="32" cy="132" r="3" fill="#06B6D4"/>
    <text x="42" y="136" fill="#E2E8F0" font-size="12" font-weight="500">PostgreSQL Row-Level Synchronous Triggers</text>
    
    <circle cx="32" cy="154" r="3" fill="#06B6D4"/>
    <text x="42" y="158" fill="#E2E8F0" font-size="12" font-weight="500">CDC Sync Scheduler (Kafka / AWS S3 WORM Store)</text>
    
    <circle cx="32" cy="176" r="3" fill="#06B6D4"/>
    <text x="42" y="180" fill="#E2E8F0" font-size="12" font-weight="500">Cryptographic SHA-256 Checksum Signature Chain</text>
    
    <circle cx="32" cy="198" r="3" fill="#06B6D4"/>
    <text x="42" y="202" fill="#E2E8F0" font-size="12" font-weight="500">Grafana Loki Structured Business Event Dispatcher</text>

    <!-- Footer Tag -->
    <rect x="16" y="230" width="358" height="52" rx="6" fill="#1E293B" stroke="#164E63" stroke-width="1"/>
    <text x="26" y="250" fill="#67E8F9" font-size="11" font-weight="600">Domain Responsibility:</text>
    <text x="26" y="268" fill="#CBD5E1" font-size="11">Provides tamper-evident GxP compliance and e-signature audits.</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(35, 765)">
    <text x="0" y="16" fill="#64748B" font-size="11" font-weight="600">DDD LEGEND:</text>
    
    <rect x="90" y="6" width="12" height="12" rx="2" fill="#F59E0B"/>
    <text x="108" y="16" fill="#CBD5E1" font-size="11">Core Subdomain (Dose Order)</text>
    
    <rect x="300" y="6" width="12" height="12" rx="2" fill="#3B82F6"/>
    <text x="318" y="16" fill="#CBD5E1" font-size="11">Supporting Subdomains (IAM, Master Data, Logistics, Assay)</text>
    
    <rect x="690" y="6" width="12" height="12" rx="2" fill="#06B6D4"/>
    <text x="708" y="16" fill="#CBD5E1" font-size="11">Generic Regulatory Subdomain (Audit &amp; Telemetry)</text>

    <line x1="1020" y1="12" x2="1055" y2="12" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="1065" y="16" fill="#CBD5E1" font-size="11">Asynchronous Domain Event</text>
  </g>
</svg>