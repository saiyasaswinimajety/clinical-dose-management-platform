    <text x="16" y="22" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="0.3px">Domain-Driven Design (DDD) Component Architecture</text>
    <text x="16" y="41" fill="#94A3B8" font-size="13" font-weight="400">Regulated Clinical Order Management Platform (COMS) • Six Isolated Bounded Contexts • FDA 21 CFR Part 11</text>
    
    <!-- Top-Right Compliance Pills -->
    <g transform="translate(740, 2)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#10B981"/>
      <text x="24" y="17" fill="#E2E8F0" font-size="11" font-weight="600">21 CFR Part 11</text>

      <rect x="142" y="0" width="170" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="154" cy="13" r="4" fill="#38BDF8"/>
      <text x="166" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Event-Driven Sync</text>

      <rect x="324" y="0" width="160" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="336" cy="13" r="4" fill="#F59E0B"/>
      <text x="348" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Zero-Trust RBAC</text>
    </g>
  </g>

  <!-- Grid Row 1: Contexts 1, 2, 3 (y=100) -->
  
  <!-- CONTEXT 1: Identity & Access (x=35, y=100, w=390, h=300) -->
  <g transform="translate(35, 100)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="390" height="300" rx="10" fill="url(#cardDark)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="390" height="5" rx="2.5" fill="url(#blueAccent)"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="135" height="20" rx="4" fill="#1E3A8A" fill-opacity="0.6"/>
    <text x="24" y="30" fill="#93C5FD" font-size="10" font-weight="700" letter-spacing="0.6px">BOUNDED CONTEXT 01</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Identity &amp; Access (IAM)</text>
    <text x="16" y="76" fill="#94A3B8" font-size="11.5">Multi-tenant auth &amp; 8-tier privilege enforcement</text>
    
    <!-- Entities Box -->
    <rect x="16" y="92" width="358" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="114" fill="#60A5FA" font-size="11" font-weight="700">CORE DOMAIN ENTITIES &amp; SERVICES:</text>
    
    <circle cx="32" cy="132" r="3" fill="#38BDF8"/>
    <text x="42" y="136" fill="#E2E8F0" font-size="12" font-weight="500">Enterprise Azure AD &amp; Hospital ID.me SSO</text>
    
    <circle cx="32" cy="154" r="3" fill="#38BDF8"/>
    <text x="42" y="158" fill="#E2E8F0" font-size="12" font-weight="500">8-Tier RBAC Hierarchy (Coordinator, QA, Driver)</text>
    
    <circle cx="32" cy="176" r="3" fill="#38BDF8"/>
    <text x="42" y="180" fill="#E2E8F0" font-size="12" font-weight="500">RAM License Validator (Possession Thresholds)</text>
    
    <circle cx="32" cy="198" r="3" fill="#38BDF8"/>
    <text x="42" y="202" fill="#E2E8F0" font-size="12" font-weight="500">JwtAuthFilter &amp; Dynamic Date Validity Range</text>

    <!-- Footer Tag -->
    <rect x="16" y="230" width="358" height="52" rx="6" fill="#1E293B" stroke="#1E3A8A" stroke-width="1"/>
    <text x="26" y="250" fill="#93C5FD" font-size="11" font-weight="600">Domain Responsibility:</text>
    <text x="26" y="268" fill="#CBD5E1" font-size="11">Guarantees only licensed facilities can place active orders.</text>
  </g>

  <!-- CONTEXT 2: Master Data & Regulatory (x=465, y=100, w=390, h=300) -->
  <g transform="translate(465, 100)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="390" height="300" rx="10" fill="url(#cardDark)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="390" height="5" rx="2.5" fill="url(#emeraldAccent)"/>
    
    <!-- Header -->
    <rect x="16" y="16" width="135" height="20" rx="4" fill="#064E3B" fill-opacity="0.6"/>
    <text x="24" y="30" fill="#6EE7B7" font-size="10" font-weight="700" letter-spacing="0.6px">BOUNDED CONTEXT 02</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Master Data &amp; Regulatory</text>
    <text x="16" y="76" fill="#94A3B8" font-size="11.5">Clinical protocol specs, sites &amp; decay constants</text>
    
    <!-- Entities Box -->
    <rect x="16" y="92" width="358" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="114" fill="#34D399" font-size="11" font-weight="700">CORE DOMAIN ENTITIES &amp; SERVICES:</text>
    
    <circle cx="32" cy="132" r="3" fill="#10B981"/>
    <text x="42" y="136" fill="#E2E8F0" font-size="12" font-weight="500">Clinical Protocols (PET-F18, 68Ga-DOTATATE, PSMA)</text>
    
    <circle cx="32" cy="154" r="3" fill="#10B981"/>
    <text x="42" y="158" fill="#E2E8F0" font-size="12" font-weight="500">Master Partners (Imaging Sites &amp; Cyclotrons)</text>
    
    <circle cx="32" cy="176" r="3" fill="#10B981"/>
    <text x="42" y="180" fill="#E2E8F0" font-size="12" font-weight="500">Isotope Library (t½: F-18 109.8m, C-11 20.3m)</text>
    
    <circle cx="32" cy="198" r="3" fill="#10B981"/>
    <text x="42" y="202" fill="#E2E8F0" font-size="12" font-weight="500">RAM Licenses &amp; Max Activity Possession Limits</text>

    <!-- Footer Tag -->
    <rect x="16" y="230" width="358" height="52" rx="6" fill="#1E293B" stroke="#064E3B" stroke-width="1"/>
    <text x="26" y="250" fill="#6EE7B7" font-size="11" font-weight="600">Domain Responsibility:</text>
    <text x="26" y="268" fill="#CBD5E1" font-size="11">Maintains immutable isotope parameters and site licenses.</text>
  </g>

