<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 740" width="100%" height="100%" style="background:#0B0F19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Card Dark Background -->
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Gradients for Stages -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FB7185"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC"/>
    </marker>
  </defs>

  <!-- Solid Canvas Background -->
  <rect width="100%" height="100%" fill="url(#canvasBg)" rx="14" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Header Bar -->
  <g transform="translate(35, 26)">
    <rect x="0" y="0" width="4" height="44" fill="#38BDF8" rx="2"/>
    <text x="16" y="22" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="0.3px">Capacity Management Engine — Dynamic Decision Flow</text>
    <text x="16" y="41" fill="#94A3B8" font-size="13" font-weight="400">Simultaneous Multi-Constraint Optimization: Logistics Arrival, Physical Decay Kinetics, and Syringe Limits</text>
    
    <!-- Top-Right Status Pills -->
    <g transform="translate(780, 2)">
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#10B981"/>
      <text x="24" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Real-Time Solver</text>

      <rect x="147" y="0" width="155" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="159" cy="13" r="4" fill="#38BDF8"/>
      <text x="171" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Physical Decay Guard</text>

      <rect x="314" y="0" width="145" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="326" cy="13" r="4" fill="#F59E0B"/>
      <text x="338" y="17" fill="#E2E8F0" font-size="11" font-weight="600">3-Lane Priority</text>
    </g>
  </g>

  <!-- STAGE 1: INPUTS (x=35, y=95, w=275, h=545) -->
  <g transform="translate(35, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="275" height="545" rx="10" fill="url(#cardDark)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="275" height="5" rx="2.5" fill="url(#blueGrad)"/>

    <rect x="16" y="16" width="130" height="20" rx="4" fill="#1E3A8A" fill-opacity="0.6"/>
    <text x="24" y="30" fill="#93C5FD" font-size="10" font-weight="700" letter-spacing="0.6px">STAGE 1: INPUTS</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Order &amp; Constraints</text>
    <text x="16" y="76" fill="#94A3B8" font-size="11.5">Tri-factor constraint parameters</text>

    <!-- Sub-card A: Demand -->
    <rect x="14" y="92" width="247" height="130" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="112" fill="#38BDF8" font-size="11.5" font-weight="700">1. CLINICAL PRESCRIPTION</text>
    <text x="24" y="132" fill="#CBD5E1" font-size="11">• Product / Isotope (F-18, C-11)</text>
    <text x="24" y="150" fill="#CBD5E1" font-size="11">• Target Activity Qty: Q (mCi)</text>
    <text x="24" y="168" fill="#CBD5E1" font-size="11">• Destination Imaging Site</text>
    <text x="24" y="186" fill="#CBD5E1" font-size="11">• Requested Calib Time (t_calib)</text>
    <text x="24" y="204" fill="#CBD5E1" font-size="11">• Delivery Date &amp; Shift</text>

    <!-- Sub-card B: Supply -->
    <rect x="14" y="234" width="247" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="254" fill="#38BDF8" font-size="11.5" font-weight="700">2. CYCLOTRON BATCH</text>
    <text x="24" y="274" fill="#CBD5E1" font-size="11">• End-of-Synthesis Time (t_EOS)</text>
    <text x="24" y="292" fill="#CBD5E1" font-size="11">• Batch Synthesizer Capacity (mCi)</text>
    <text x="24" y="310" fill="#CBD5E1" font-size="11">• Total Batch Volume (mL)</text>
    <text x="24" y="328" fill="#CBD5E1" font-size="11">• Specific Decay Constant (λ)</text>
    <text x="24" y="346" fill="#CBD5E1" font-size="11">• Existing Allocated Reserves</text>

    <!-- Sub-card C: Logistics -->
    <rect x="14" y="381" width="247" height="140" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="401" fill="#38BDF8" font-size="11.5" font-weight="700">3. ROUTING &amp; TRANSIT</text>
    <text x="24" y="421" fill="#CBD5E1" font-size="11">• Courier Departure Time (t_ship)</text>
    <text x="24" y="439" fill="#CBD5E1" font-size="11">• Transit Duration (t_transit)</text>
    <text x="24" y="457" fill="#CBD5E1" font-size="11">• Safety Buffer Time (t_buffer)</text>
    <text x="24" y="475" fill="#CBD5E1" font-size="11">• Hospital Receiving Dock Window</text>
    <text x="24" y="493" fill="#CBD5E1" font-size="11">• Syringe Min/Max Volume Limits</text>
  </g>

  <!-- Flow Arrow: Stage 1 -> Stage 2 -->
  <path d="M 315 365 L 340 365" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- STAGE 2: PARALLEL BOUNDARY SOLVERS (x=345, y=95, w=440, h=545) -->
  <g transform="translate(345, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="440" height="545" rx="10" fill="url(#cardDark)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="440" height="5" rx="2.5" fill="url(#purpleGrad)"/>

    <rect x="16" y="16" width="155" height="20" rx="4" fill="#4C1D95" fill-opacity="0.6"/>
    <text x="24" y="30" fill="#C4B5FD" font-size="10" font-weight="700" letter-spacing="0.6px">STAGE 2: BOUNDARY SOLVER</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Parallel Window Boundaries</text>
    <text x="16" y="76" fill="#94A3B8" font-size="11.5">Simultaneous arrival &amp; physical decay calculations</text>

    <!-- UPPER CARD: EARLIEST BOUNDARY -->
    <rect x="14" y="92" width="412" height="205" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <rect x="14" y="92" width="412" height="24" rx="4" fill="#1E3A8A" fill-opacity="0.5"/>
    <text x="24" y="108" fill="#93C5FD" font-size="11.5" font-weight="700">BOUNDARY 1: EARLIEST CALIBRATION TIME (T_earliest)</text>
    
    <!-- Path A -->
    <text x="24" y="132" fill="#38BDF8" font-size="11" font-weight="700">Path A: Transit Physical Arrival (Time_A)</text>
    <text x="34" y="148" fill="#F1F5F9" font-family="monospace" font-size="11">Time_A = t_ship + t_transit + t_buffer</text>
    <text x="34" y="162" fill="#94A3B8" font-size="10.5">• Governed by courier flight and ground driving duration</text>

    <!-- Path B -->
    <text x="24" y="184" fill="#38BDF8" font-size="11" font-weight="700">Path B: Min Volume Safety Decay (Time_B)</text>
    <text x="34" y="200" fill="#F1F5F9" font-family="monospace" font-size="11">Time_B = t_EOS + (1/λ) · ln( (MinVol/BatchVol) · (Capacity/Qty) )</text>
    <text x="34" y="214" fill="#94A3B8" font-size="10.5">• Only if min_dose_vol &gt; 0; prevents handling overly hot dose</text>

    <!-- Binding Equation -->
    <rect x="24" y="232" width="392" height="52" rx="5" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="34" y="252" fill="#60A5FA" font-size="11" font-weight="700">EARLIEST BINDING CONSTRAINT:</text>
    <text x="34" y="272" fill="#F8FAFC" font-size="14" font-weight="700">T_earliest = MAX( Time_A , Time_B )</text>

    <!-- LOWER CARD: LATEST BOUNDARY -->
    <rect x="14" y="310" width="412" height="220" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <rect x="14" y="310" width="412" height="24" rx="4" fill="#78350F" fill-opacity="0.5"/>
    <text x="24" y="326" fill="#FDE68A" font-size="11.5" font-weight="700">BOUNDARY 2: LATEST INJECTION TIME (T_latest)</text>
    
    <!-- Path X -->
    <text x="24" y="350" fill="#FBBF24" font-size="11" font-weight="700">Path X: Batch Decay Limit (Time_X)</text>
    <text x="34" y="366" fill="#F1F5F9" font-family="monospace" font-size="11">Time_X = t_EOS + (1/λ) · ln( ReducedCapacity / Qty )</text>
    <text x="34" y="380" fill="#94A3B8" font-size="10.5">• Point when available batch activity drops below ordered quantity</text>

    <!-- Path Y & Z -->
    <text x="24" y="402" fill="#FBBF24" font-size="11" font-weight="700">Path Y: Schedule Cutoff (Time_Y) &amp; Path Z: Max Syringe Volume</text>
    <text x="34" y="418" fill="#F1F5F9" font-family="monospace" font-size="11">Time_Y = t_EOS + 10 hours (Standard GxP Shift Window)</text>
    <text x="34" y="432" fill="#94A3B8" font-size="10.5">• Time_Z limits maximum syringe liquid volume (MaxVol / Concentration)</text>

    <!-- Binding Equation -->
    <rect x="24" y="450" width="392" height="65" rx="5" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="34" y="470" fill="#FBBF24" font-size="11" font-weight="700">LATEST BINDING CONSTRAINT:</text>
    <text x="34" y="490" fill="#F8FAFC" font-size="14" font-weight="700">T_latest = MIN( Time_X , Time_Y , Time_Z )</text>
    <text x="34" y="506" fill="#94A3B8" font-size="10.5">Normal days: Schedule-based wins (80%). High demand: Capacity wins.</text>
  </g>

  <!-- Flow Arrow: Stage 2 -> Stage 3 -->
  <path d="M 790 365 L 815 365" stroke="#C084FC" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- STAGE 3: WINDOW VALIDATION (x=820, y=95, w=245, h=545) -->
  <g transform="translate(820, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="245" height="545" rx="10" fill="url(#cardDark)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="245" height="5" rx="2.5" fill="url(#emeraldGrad)"/>

    <rect x="14" y="16" width="155" height="20" rx="4" fill="#064E3B" fill-opacity="0.6"/>
    <text x="22" y="30" fill="#6EE7B7" font-size="10" font-weight="700" letter-spacing="0.6px">STAGE 3: VALIDATION</text>
    <text x="14" y="58" fill="#F8FAFC" font-size="16" font-weight="700">Window Gate</text>
    <text x="14" y="76" fill="#94A3B8" font-size="11.5">Physically viable window</text>

    <!-- Evaluation Box 1 -->
    <rect x="14" y="92" width="217" height="120" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="22" y="112" fill="#34D399" font-size="11" font-weight="700">CHECK 1: FEASIBILITY</text>
    <rect x="22" y="122" width="201" height="35" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="0.8"/>
    <text x="32" y="144" fill="#FFFFFF" font-size="13" font-weight="700">T_latest ≥ T_earliest ?</text>
    <text x="22" y="172" fill="#94A3B8" font-size="10.5">• Ensures injection window</text>
    <text x="22" y="186" fill="#94A3B8" font-size="10.5">  duration ΔT &gt; 0 minutes</text>
    <text x="22" y="200" fill="#94A3B8" font-size="10.5">• Checks courier feasibility</text>

    <!-- Evaluation Box 2 -->
    <rect x="14" y="222" width="217" height="130" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="22" y="242" fill="#34D399" font-size="11" font-weight="700">CHECK 2: CALIBRATION</text>
    <rect x="22" y="252" width="201" height="35" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="0.8"/>
    <text x="32" y="274" fill="#FFFFFF" font-size="12" font-weight="700">t_calib ∈ [T_earliest , T_latest]</text>
    <text x="22" y="302" fill="#94A3B8" font-size="10.5">• Requested prescription slot</text>
    <text x="22" y="316" fill="#94A3B8" font-size="10.5">  falls inside allowable range</text>
    <text x="22" y="330" fill="#94A3B8" font-size="10.5">• Patient scan time verified</text>

    <!-- Summary Box -->
    <rect x="14" y="362" width="217" height="168" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="22" y="382" fill="#E2E8F0" font-size="11" font-weight="700">STATISTICAL DISTRIBUTION:</text>
    <text x="22" y="404" fill="#93C5FD" font-size="10.5">• Transit-Based wins earliest:</text>
    <text x="32" y="420" fill="#E2E8F0" font-size="11" font-weight="600">90% of all clinical orders</text>
    <text x="22" y="444" fill="#FDE68A" font-size="10.5">• Schedule-Based wins latest:</text>
    <text x="32" y="460" fill="#E2E8F0" font-size="11" font-weight="600">80% on normal-demand days</text>
    <text x="22" y="484" fill="#FCA5A5" font-size="10.5">• Capacity-Based wins latest:</text>
    <text x="32" y="500" fill="#E2E8F0" font-size="11" font-weight="600">High-volume batch spikes</text>
  </g>

  <!-- Flow Arrows: Stage 3 -> Stage 4 (Approved vs Rejected) -->
  <path d="M 1065 240 L 1095 210" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 1065 470 L 1095 490" stroke="#FB7185" stroke-width="2.5" marker-end="url(#arrow-rose)"/>

  <!-- STAGE 4: TERMINAL DECISIONS (x=1100, y=95, w=185, h=545) -->
  
  <!-- APPROVED TERMINAL CARD (y=95, h=250) -->
  <g transform="translate(1100, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="185" height="250" rx="10" fill="url(#cardDark)" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="5" rx="2.5" fill="url(#emeraldGrad)"/>

    <rect x="12" y="16" width="120" height="20" rx="4" fill="#064E3B" fill-opacity="0.7"/>
    <text x="20" y="30" fill="#6EE7B7" font-size="10" font-weight="700">VALID ORDER</text>
    <text x="12" y="56" fill="#34D399" font-size="15" font-weight="700">Order Accepted</text>

    <rect x="10" y="72" width="165" height="165" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="18" y="92" fill="#34D399" font-size="11" font-weight="700">ACTIONS FIRED:</text>
    <text x="18" y="112" fill="#E2E8F0" font-size="10.5">✓ Soft-lock required</text>
    <text x="28" y="126" fill="#E2E8F0" font-size="10.5">  activity in batch</text>
    <text x="18" y="146" fill="#E2E8F0" font-size="10.5">✓ Bind courier transit</text>
    <text x="28" y="160" fill="#E2E8F0" font-size="10.5">  dispatch flight</text>
    <text x="18" y="180" fill="#E2E8F0" font-size="10.5">✓ Emit domain event:</text>
    <text x="28" y="194" fill="#38BDF8" font-size="10" font-family="monospace">CapacityReserved</text>
    <text x="18" y="214" fill="#E2E8F0" font-size="10.5">✓ State: PLACED</text>
  </g>

  <!-- REJECTED TERMINAL CARD (y=375, h=265) -->
  <g transform="translate(1100, 375)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="185" height="265" rx="10" fill="url(#cardDark)" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="5" rx="2.5" fill="url(#roseGrad)"/>

    <rect x="12" y="16" width="130" height="20" rx="4" fill="#881337" fill-opacity="0.7"/>
    <text x="20" y="30" fill="#FDA4AF" font-size="10" font-weight="700">CANNOT FULFILL</text>
    <text x="12" y="56" fill="#FB7185" font-size="15" font-weight="700">Order Rejected</text>

    <rect x="10" y="72" width="165" height="180" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
    <text x="18" y="92" fill="#FB7185" font-size="11" font-weight="700">DIAGNOSTIC REASON:</text>
    <text x="18" y="112" fill="#CBD5E1" font-size="10">• TRANSIT_UNFEASIBLE</text>
    <text x="26" y="126" fill="#94A3B8" font-size="9.5">(Arrival &gt; Latest Time)</text>
    <text x="18" y="146" fill="#CBD5E1" font-size="10">• TOO_HOT_FOR_VOLUME</text>
    <text x="26" y="160" fill="#94A3B8" font-size="9.5">(MinVol decay safe limit)</text>
    <text x="18" y="180" fill="#CBD5E1" font-size="10">• CAPACITY_EXHAUSTED</text>
    <text x="26" y="194" fill="#94A3B8" font-size="9.5">(Batch overshoot pool 0)</text>
    <text x="18" y="214" fill="#FBBF24" font-size="10.5" font-weight="600">Suggest Next Slot</text>
    <text x="18" y="230" fill="#CBD5E1" font-size="10">Next day cyclotron batch</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(35, 665)">
    <text x="0" y="16" fill="#64748B" font-size="11" font-weight="600">DECISION ENGINE LEGEND:</text>
    
    <rect x="180" y="6" width="12" height="12" rx="2" fill="#38BDF8"/>
    <text x="198" y="16" fill="#CBD5E1" font-size="11">Earliest Time (Transit / Safety Decay)</text>
    
    <rect x="440" y="6" width="12" height="12" rx="2" fill="#F59E0B"/>
    <text x="458" y="16" fill="#CBD5E1" font-size="11">Latest Time (Capacity / Schedule Cutoff)</text>
    
    <rect x="720" y="6" width="12" height="12" rx="2" fill="#34D399"/>
    <text x="738" y="16" fill="#CBD5E1" font-size="11">Approved Window &amp; Soft Lock</text>

    <rect x="940" y="6" width="12" height="12" rx="2" fill="#FB7185"/>
    <text x="958" y="16" fill="#CBD5E1" font-size="11">Rejected with Diagnostic Reason</text>
  </g>
</svg>