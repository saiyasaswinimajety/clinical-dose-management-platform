      <text x="10" y="16" font-family="monospace" font-size="10" fill="#94a3b8">dose_orders (Status)</text>
      
      <rect x="185" y="0" width="175" height="24" rx="4" fill="#0f172a"/>
      <text x="195" y="16" font-family="monospace" font-size="10" fill="#94a3b8">audit_logs (Hash Chain)</text>
    </g>
    <text x="20" y="156" font-family="monospace" font-size="10" fill="#34d399">Flyway Migrations: V1__init_schema.sql, V2__add_audit_logs.sql</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 640)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Engineered by Sai Yasaswini Majety | Senior Software Engineer - Dose Management Platform | Production Grade Architecture</text>
  </g>
</svg>
