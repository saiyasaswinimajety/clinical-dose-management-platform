    <text x="52" y="42" font-family="sans-serif" font-size="10" fill="#d97706">Nuclear Exponential Law: A(t)=A₀e^(-λt)</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#334155" stroke-width="1"/>
    <text x="16" y="70" font-family="monospace" font-size="10" fill="#cbd5e1">• F-18 (t½ = 109.77m) | C-11 (20.36m)</text>
    <text x="16" y="86" font-family="monospace" font-size="10" fill="#cbd5e1">• Ga-68 (67.71m) | Lu-177 (6.64d)</text>
    <text x="16" y="102" font-family="monospace" font-size="10" fill="#fbbf24">• Real-time Synthesis Overshoot Auto-Comp</text>
  </g>

  <!-- LAYER 3B: Temporal Distributed Workflow Engine -->
  <g transform="translate(670, 255)" filter="url(#shadow)">
    <rect width="260" height="115" rx="12" fill="url(#cardGrad)" stroke="url(#purpleGlow)" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="6" fill="#581c87" fill-opacity="0.4"/>
