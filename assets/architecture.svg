    <text x="52" y="42" font-family="sans-serif" font-size="10" fill="#a855f7">Durable Orchestration &amp; Signals</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#334155" stroke-width="1"/>
    <text x="16" y="70" font-family="monospace" font-size="10" fill="#cbd5e1">• State Machine: Batch → Prep → QA → Transit</text>
    <text x="16" y="86" font-family="monospace" font-size="10" fill="#cbd5e1">• Non-blocking Signals (Workflow.await)</text>
    <text x="16" y="102" font-family="monospace" font-size="10" fill="#c084fc">• Zero-Drift Resilient Dosing Schedule</text>
  </g>

  <!-- LAYER 4: Notification & Dispatch Target -->
  <g transform="translate(990, 210)" filter="url(#shadow)">
    <rect width="160" height="130" rx="12" fill="url(#cardGrad)" stroke="url(#purpleGlow)" stroke-width="1"/>
    <rect x="14" y="14" width="26" height="26" rx="6" fill="#1e1b4b" fill-opacity="0.6"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" fill="#818cf8">🚚</text>
    <text x="48" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#e0e7ff">Lead Pig Dispatch</text>
    <text x="48" y="42" font-family="sans-serif" font-size="10" fill="#94a3b8">Active Telemetry</text>
    <line x1="14" y1="52" x2="146" y2="52" stroke="#334155" stroke-width="1"/>
    <text x="14" y="72" font-family="sans-serif" font-size="10" fill="#cbd5e1">• GPS Courier Transit</text>
    <text x="14" y="90" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Radiation Monitor</text>
    <text x="14" y="108" font-family="sans-serif" font-size="10" fill="#34d399">• Site Delivery Confirmation</text>
  </g>

  <!-- LAYER 5: 21 CFR Part 11 Cryptographic Audit Trail -->
  <g transform="translate(180, 420)" filter="url(#shadow)">
    <rect width="500" height="170" rx="14" fill="url(#cardGrad)" stroke="url(#emeraldGlow)" stroke-width="2"/>
    <rect x="20" y="18" width="36" height="36" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="29" y="42" font-family="sans-serif" font-size="18" fill="#34d399">🛡️</text>
    <text x="68" y="34" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">21 CFR Part 11 Immutable Audit Trail</text>
    <text x="68" y="50" font-family="sans-serif" font-size="11" fill="#34d399">Forward Cryptographic Hash Chaining &amp; Electronic Signature Ledger</text>
    <line x1="20" y1="66" x2="480" y2="66" stroke="#334155" stroke-width="1"/>
    
    <!-- Mini Hash Chain Visualization -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="16" font-family="monospace" font-size="9" fill="#6ee7b7">RECORD N-1</text>
      <text x="10" y="32" font-family="monospace" font-size="8" fill="#64748b">Hash: 8a4f9b2d...</text>

      <path d="M 130 21 L 155 21" stroke="#34d399" stroke-width="2"/>

      <rect x="155" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="165" y="16" font-family="monospace" font-size="9" fill="#34d399">RECORD N</text>
      <text x="165" y="32" font-family="monospace" font-size="8" fill="#94a3b8">Prev: 8a4f9b2d...</text>

      <path d="M 285 21 L 310 21" stroke="#34d399" stroke-width="2"/>

      <rect x="310" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="320" y="16" font-family="monospace" font-size="9" fill="#6ee7b7">RECORD N+1</text>
      <text x="320" y="32" font-family="monospace" font-size="8" fill="#64748b">Prev: 3e7c01b4...</text>
    </g>

    <text x="20" y="145" font-family="monospace" font-size="10" fill="#94a3b8">H(N) = SHA-256( H(N-1) | EntityType | EntityId | Action | PerformedBy | Timestamp | Payload | Salt )</text>
    <text x="20" y="160" font-family="sans-serif" font-size="10" fill="#34d399">✓ Zero Mutation Tolerated: Instant Tamper Pinpoint via GET /api/v1/audit-trail/verify</text>
  </g>

  <!-- LAYER 6: Persistence Layer (PostgreSQL 16 + Flyway) -->
  <g transform="translate(750, 420)" filter="url(#shadow)">
    <rect width="400" height="170" rx="14" fill="url(#cardGrad)" stroke="url(#blueGlow)" stroke-width="1.5"/>
    <rect x="20" y="18" width="36" height="36" rx="8" fill="#1e293b"/>
    <text x="28" y="42" font-family="sans-serif" font-size="18" fill="#38bdf8">🐘</text>
    <text x="68" y="34" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">PostgreSQL 16 &amp; Flyway</text>
    <text x="68" y="50" font-family="sans-serif" font-size="11" fill="#38bdf8">ACID Compliant Relational &amp; Audit Storage</text>
    <line x1="20" y1="66" x2="380" y2="66" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(20, 80)">
      <rect width="170" height="24" rx="4" fill="#0f172a"/>
      <text x="10" y="16" font-family="monospace" font-size="10" fill="#94a3b8">isotopes (t½ index)</text>
      
      <rect x="185" y="0" width="175" height="24" rx="4" fill="#0f172a"/>
      <text x="195" y="16" font-family="monospace" font-size="10" fill="#94a3b8">clinical_protocols</text>
    </g>
    <g transform="translate(20, 110)">
